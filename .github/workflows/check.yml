name: Check and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Build
    # Spec §48. Runs §58 quality gate: format → lint → typecheck → test → rules → build.
    # The same gate as 'npm run check' locally. Needs Java 21+ (R-02) for the emulator.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up config
        run: |
          cp apps/web/.env.example apps/web/.env.local
          cat apps/web/.env.local

      - name: Quality gate
        run: npm run check
